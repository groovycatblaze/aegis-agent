name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: ruff check . --select E9,F63,F7,F82
      - run: pytest
      - name: Offline benchmark (simulated LLM, stdio MCP)
        run: python -m evaluation.benchmark --out ci-results
      - uses: actions/upload-artifact@v4
        with: {name: benchmark-results, path: ci-results}
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aegis-agent .
